name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  end-to-end:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile bridge
        run: python -m py_compile paper-revision-bridge/scripts/bridge.py
      - name: Run end-to-end workflow
        run: python tests/test_bridge_e2e.py
      - name: Parse Windows monitor script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/paper-revision-bridge/scripts/windows_monitor.ps1",
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }
